<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国家队资金监控</title>
<style>
:root{
  --bg:#0c0f14;
  --card:#161b22;
  --line:#2a3140;
  --ink:#e7ecf3;
  --muted:#8b95a8;
  --up:#e54545;
  --down:#1aa36a;
  --flat:#9aa3b2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 28px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
h1{font-size:16px;font-weight:650;margin:0;letter-spacing:.02em}
.status{color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-weight:600}
.err{display:none;margin:8px 0 12px;padding:8px 10px;border:1px solid #6b3030;border-radius:8px;color:#ffb4b4}
.banner{display:none;margin:0 0 10px;padding:10px 12px;border:1px solid #8a3030;border-radius:10px;background:#2a1416;color:#ffd0d0;white-space:pre-line}
.banner.show{display:block}
.anomaly{margin:8px 0 0;color:var(--muted);font-size:13px}
.anomaly div{margin:2px 0}
tr.spike td{background:#3a1618}
.signal{padding:18px 20px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.signal.hot{border-color:#8a3030}
.signal .label{font-size:32px;font-weight:720;letter-spacing:.01em;line-height:1.15}
.signal .meta{margin-top:8px;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:680;font-variant-numeric:tabular-nums;margin-top:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.check{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--muted);font-size:13px}
.check.on{color:var(--ink);border-color:#3d4a63}
.mark{width:8px;height:8px;border-radius:50%;background:#3a4254;display:inline-block}
.check.on .mark{background:var(--ink)}
.chart{height:320px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel{margin-top:12px}
.panel h2{font-size:13px;font-weight:650;margin:0 0 8px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--flat)}
footer{margin-top:18px;color:var(--muted);font-size:12px}
@media(max-width:800px){
  .kpis{grid-template-columns:1fr 1fr}
  .signal .label{font-size:26px}
  header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>国家队资金监控</h1>
    <div class="status" id="status">加载中</div>
  </header>
  <div class="err" id="err"></div>
  <div class="banner" id="vol-banner"></div>
  <section class="signal" id="signal">
    <div class="label" id="signal-label">—</div>
    <div class="meta" id="signal-meta"></div>
  </section>
  <div class="kpis" id="kpis"></div>
  <div class="checks" id="checks"></div>
  <div class="chart" id="chart"></div>
  <section class="panel">
    <h2 id="etf-title">宽基 ETF</h2>
    <div id="etf"></div>
    <div class="anomaly" id="anomaly"></div>
  </section>
  <section class="panel" id="ann-panel" hidden>
    <h2>公告</h2>
    <div id="anns"></div>
  </section>
  <section class="panel" id="hold-panel" hidden>
    <h2>季度持仓</h2>
    <div id="holds"></div>
  </section>
  <footer id="foot"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function num(v){
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function cls(v){
    if (v == null) return 'flat';
    return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat');
  }
  function plain(v){
    var n = num(v);
    return n == null ? '—' : n.toFixed(1);
  }
  function fmt(v, d){
    if (v == null) return '—';
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return (n > 0 ? '+' : '') + n.toFixed(d == null ? 1 : d);
  }
  function sumLast(items, n){
    var slice = items.slice(-n);
    var t = 0;
    for (var i = 0; i < slice.length; i++) t += num(slice[i].net_subscription_yi) || 0;
    return slice.length ? t : null;
  }
  function table(headers, rows){
    return '<div class="scroll"><table><thead><tr>' + headers.map(function(h){
      return '<th class="' + (h.num ? 'num' : '') + '">' + esc(h.t) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function fail(msg){
    var el = $('err');
    el.style.display = 'block';
    el.textContent = msg || '数据加载失败';
    $('status').textContent = '未连接';
  }
  function render(overview, shares, momentum, source, anns, holds){
    var sig = overview.signal || {};
    var items = (shares && shares.items) || [];
    var last = items.length ? items[items.length - 1] : null;
    var demo = overview.is_demo === true;
    var src = '';
    if (!demo && source){
      var raw = String(source.dataset_source || '');
      src = raw && raw !== 'unknown' ? raw.split(':')[0] : (source.mode === 'snapshot' ? '未核验' : '');
    }
    var day = overview.as_of || (last && last.date) || '';
    $('status').innerHTML = '<b>' + esc(day || '—') + '</b> · '
      + (demo ? '演示' : '实盘')
      + (src ? ' · ' + esc(src) : '');
    var card = $('signal');
    card.className = 'signal' + (sig.state === 'POLICY_BOTTOM_PROBABLE' ? ' hot' : '');
    $('signal-label').textContent = sig.state_label || '—';
    $('signal-meta').textContent = sig.confidence_label ? ('置信度 ' + sig.confidence_label) : '';
    var kpis = [
      ['当日净申购', last ? num(last.net_subscription_yi) : null, '亿'],
      ['近3日', sumLast(items, 3), '亿'],
      ['近5日', sumLast(items, 5), '亿'],
      ['指数', last ? num(last.index_change_pct) : null, '%']
    ];
    $('kpis').innerHTML = kpis.map(function(k){
      return '<div class="kpi"><div class="k">' + esc(k[0]) + '</div>'
        + '<div class="v ' + cls(k[1]) + '">' + fmt(k[1]) + '<span style="font-size:13px;font-weight:500"> ' + k[2] + '</span></div></div>';
    }).join('');
    var cond = sig.conditions || {};
    var order = ['market_drop', 'etf_sync', 'official'];
    $('checks').innerHTML = order.map(function(key){
      var c = cond[key];
      if (!c) return '';
      var on = c.met === true;
      return '<div class="check' + (on ? ' on' : '') + '"><i class="mark"></i>'
        + esc(c.label || key) + '</div>';
    }).join('');
    draw(items);
    var etfs = (momentum && momentum.items) || [];
    var threshold = (momentum && momentum.summary && num(momentum.summary.threshold)) || 2;
    if (momentum && momentum.date) $('etf-title').textContent = '宽基 ETF · ' + momentum.date;
    $('etf').innerHTML = table(
      [{t:'代码'},{t:'名称'},{t:'当日成交额',num:1},{t:'前日成交额',num:1},{t:'环比增量',num:1},
       {t:'环比增长率',num:1},{t:'放量倍数',num:1},{t:'份额变化',num:1}],
      etfs.map(function(it){
        var pct = num(it.amount_change_pct);
        var mult = num(it.volume_multiple);
        var share = num(it.share_change_yi);
        var hot = (mult != null && mult >= threshold) || (pct != null && pct >= 100);
        return '<tr class="' + (hot ? 'spike' : '') + '"><td>' + esc(it.code) + '</td><td>' + esc(it.name) + '</td>'
          + '<td class="num">' + plain(it.amount_yi) + '</td>'
          + '<td class="num">' + plain(it.amount_prev_yi) + '</td>'
          + '<td class="num ' + cls(num(it.amount_change_yi)) + '">' + fmt(num(it.amount_change_yi)) + '</td>'
          + '<td class="num ' + cls(pct) + '">' + fmt(pct, 0) + '%</td>'
          + '<td class="num">' + (mult == null ? '—' : mult.toFixed(2)) + '</td>'
          + '<td class="num ' + cls(share) + '">' + fmt(share) + '</td></tr>';
      }).join('') || '<tr><td colspan="8">无数据</td></tr>'
    );
    var lines = (momentum && momentum.anomalies) || [];
    $('anomaly').innerHTML = lines.map(function(line){ return '<div>' + esc(line) + '</div>'; }).join('');
    var banner = $('vol-banner');
    if (momentum && momentum.volume_alert){
      banner.className = 'banner show';
      banner.textContent = lines.filter(function(line){ return line.indexOf('没有 ETF') !== 0; }).join('\n');
    } else {
      banner.className = 'banner';
      banner.textContent = '';
    }
    var aItems = (anns && anns.items) || [];
    if (aItems.length){
      $('ann-panel').hidden = false;
      $('anns').innerHTML = table(
        [{t:'日期'},{t:'来源'},{t:'标题'}],
        aItems.map(function(it){
          return '<tr><td>' + esc(it.date) + '</td><td>' + esc(it.source) + '</td><td>' + esc(it.title) + '</td></tr>';
        }).join('')
      );
    }
    var hItems = (holds && holds.items) || [];
    if (hItems.length){
      $('hold-panel').hidden = false;
      $('holds').innerHTML = table(
        [{t:'代码'},{t:'名称'},{t:'主体'},{t:'报告期'},{t:'披露日'},{t:'持股',num:1}],
        hItems.map(function(it){
          return '<tr><td>' + esc(it.code) + '</td><td>' + esc(it.name) + '</td><td>' + esc(it.entity) + '</td>'
            + '<td>' + esc(it.report_period) + '</td><td>' + esc(it.disclose_date) + '</td>'
            + '<td class="num">' + (it.shares == null ? '—' : Number(it.shares).toLocaleString('zh-CN')) + '</td></tr>';
        }).join('')
      );
    }
    $('foot').textContent = overview.disclaimer || '';
  }
  function draw(items){
    var box = $('chart');
    if (!window.echarts){ box.textContent = '图表未加载'; return; }
    var chart = echarts.init(box);
    var dates = items.map(function(d){ return d.date; });
    chart.setOption({
      backgroundColor:'transparent',
      grid:{left:48,right:56,top:28,bottom:28},
      tooltip:{trigger:'axis'},
      legend:{data:['净申购','沪深300'],textStyle:{color:'#8b95a8'},top:0},
      xAxis:{type:'category',data:dates,axisLabel:{color:'#8b95a8'},axisLine:{lineStyle:{color:'#2a3140'}}},
      yAxis:[
        {type:'value',name:'亿',nameTextStyle:{color:'#8b95a8'},axisLabel:{color:'#8b95a8'},splitLine:{lineStyle:{color:'#2a3140'}}},
        {type:'value',name:'点',nameTextStyle:{color:'#8b95a8'},axisLabel:{color:'#8b95a8'},splitLine:{show:false}}
      ],
      series:[
        {name:'净申购',type:'bar',data:items.map(function(d){
          var v = num(d.net_subscription_yi) || 0;
          return {value:v,itemStyle:{color:v >= 0 ? '#e54545' : '#1aa36a'}};
        })},
        {name:'沪深300',type:'line',yAxisIndex:1,showSymbol:false,data:items.map(function(d){ return d.index_close; }),
          lineStyle:{color:'#d7dde8',width:1.5}}
      ]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
  }
  var urls = ['/api/overview','/api/etf/shares?days=30','/api/etf/momentum','/api/datasource','/api/announcements?limit=8','/api/holdings?limit=12'];
  Promise.all(urls.map(function(u){
    return fetch(u, {cache:'no-store'}).then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  })).then(function(all){
    render(all[0], all[1], all[2], all[3], all[4], all[5]);
  }).catch(function(){
    fail('数据加载失败');
  });
})();
</script>
</body>
</html>
